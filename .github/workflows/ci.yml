name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

env:
  # Opt JavaScript actions into GitHub's Node 24 runner ahead of the Node 20 removal.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, modfetch]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
      - name: Docs drift check
        run: scripts/check-docs-drift.sh
      - name: AUR package check
        run: scripts/check-aur-package.sh

  test:
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, modfetch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Install archive integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -cover

      - name: Build CLI
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/modfetch ./cmd/modfetch

      - name: CLI smoke and importer check (no network required)
        shell: bash
        run: |
          set -euo pipefail
          ./bin/modfetch version
          ./bin/modfetch completion bash >/dev/null
          ./bin/modfetch completion zsh >/dev/null
          ./bin/modfetch completion fish >/dev/null

          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT

          cat > "$TMPDIR/config.yaml" <<EOF
          version: 1
          general:
            data_root: $TMPDIR/data
            download_root: $TMPDIR/dl
          EOF
          mkdir -p "$TMPDIR/data" "$TMPDIR/dl"

          cat > "$TMPDIR/input.txt" <<'EOF'
          https://example.com/a.bin
          https://example.com/b.bin
          EOF

          ./bin/modfetch batch import --config="$TMPDIR/config.yaml" --input="$TMPDIR/input.txt" --output="$TMPDIR/batch.yaml" --dest-dir="$TMPDIR/dl" --sha-mode=none
          test -s "$TMPDIR/batch.yaml"
          grep -q "version: 1" "$TMPDIR/batch.yaml"
          grep -q "jobs:" "$TMPDIR/batch.yaml"
          grep -q "uri: https://example.com/a.bin" "$TMPDIR/batch.yaml"
          grep -q "uri: https://example.com/b.bin" "$TMPDIR/batch.yaml"

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  test-macos:
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, ci-macos, modfetch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.22 emits test binaries that current macOS rejects for missing
          # Mach-O UUID metadata. Keep the project's minimum version unchanged,
          # but exercise the native macOS lane with the supported stable toolchain.
          go-version: stable
          # Avoid multi-gigabyte module-cache archives on the space-constrained
          # dedicated Mac runner. The shared module cache remains local.
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -cover
      - name: Native Apple Silicon build
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/modfetch ./cmd/modfetch
          ./bin/modfetch version
